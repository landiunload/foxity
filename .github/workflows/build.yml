name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Development integration follows an engine branch while both repositories
  # evolve; it is the branch with Android programs on modules by name until it
  # reaches main. Tags and release/* branches build the reviewed immutable SHA
  # that engine.lock holds instead; engine-revision below picks between them.
  LAIUE_REF: engine-android-platform
  LLVM_VERSION: '22'
  ANDROID_NDK_VERSION: 30.0.16248370

jobs:
  engine-revision:
    name: Resolve engine revision
    runs-on: ubuntu-26.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose the laiue revision for this run
        id: resolve
        shell: bash
        run: |
          locked="$(grep -v '^[[:space:]]*#' engine.lock | tr -d '[:space:]')"
          if ! printf '%s' "$locked" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "engine.lock must hold one 40-character laiue commit SHA" >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/*|refs/heads/release/*) ref="$locked" ;;
            *)
              if [[ "$LAIUE_REF" =~ ^[0-9a-f]{40}$ ]]; then
                ref="$LAIUE_REF"
              else
                if ! git check-ref-format "refs/heads/$LAIUE_REF"; then
                  echo "LAIUE_REF must name a valid engine branch or commit SHA" >&2
                  exit 1
                fi
                if ! resolved="$(git ls-remote --exit-code \
                  https://github.com/landiunload/laiue.git "refs/heads/$LAIUE_REF")"; then
                  echo "Cannot resolve engine branch: $LAIUE_REF" >&2
                  exit 1
                fi
                IFS=$'\t' read -r ref resolved_ref <<< "$resolved"
                if [[ "$resolved" != "$ref"$'\t'"refs/heads/$LAIUE_REF" ]]; then
                  echo "Engine branch lookup returned an unexpected result" >&2
                  exit 1
                fi
              fi
              ;;
          esac
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved engine revision must be one 40-character commit SHA" >&2
            exit 1
          fi
          # Every matrix job checks out this same SHA even if the branch advances.
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "laiue revision for this run: $ref"

  windows:
    name: Windows x64 (${{ matrix.preset }})
    needs: engine-revision
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, windows-clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Activate compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsRoot) { throw "Visual Studio C tools were not found" }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          # Visual Studio's bundled CMake lags behind the runner's; both
          # projects need CMake 4.2 or newer.
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notlike '*\Microsoft\CMake\*' }) -join ';'
          cmake --version
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - name: Build engine SDK
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -S _engine
          cmake --build "_engine/build/${{ matrix.preset }}" --config Release `
            --target laiue_engine_bundle --parallel
      - name: Configure game
        shell: pwsh
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE `
            "_engine/build/${{ matrix.preset }}/bundles/engine/Release/lib/cmake/laiue"
          $arguments = @('--preset', '${{ matrix.preset }}', "-Dlaiue_DIR=$engine")
          if ('${{ matrix.preset }}' -eq 'windows-clang') {
            $arguments += '-DFOX_ENABLE_CLANG_TIDY=ON'
          }
          cmake @arguments
      - name: Build and test Debug
        run: |
          cmake --build --preset ${{ matrix.preset }}-debug --parallel
          ctest --preset ${{ matrix.preset }}-debug --no-tests=error --output-on-failure
      - name: Build and test Release
        run: |
          cmake --build --preset ${{ matrix.preset }}-release --parallel
          ctest --preset ${{ matrix.preset }}-release --no-tests=error --output-on-failure
      - name: Build and test the game with the engine from source
        shell: pwsh
        run: |
          $build = "build/source-${{ matrix.preset }}"
          cmake --preset ${{ matrix.preset }} -B $build `
            "-DFOX_ENGINE_SOURCE_DIR=$env:GITHUB_WORKSPACE/_engine" `
            -DFOX_ENGINE_FETCH=OFF -Dlaiue_DIR=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($configuration in 'Debug', 'Release') {
            cmake --build $build --config $configuration --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir $build -C $configuration --no-tests=error --output-on-failure
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Stage and smoke-test the bundle
        if: matrix.preset == 'windows-msvc'
        shell: pwsh
        run: |
          cmake --build --preset windows-msvc-release --target foxity_bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build/windows-msvc/bundles/Foxity/Release'
          # A windowed program returns to PowerShell at once; wait explicitly.
          $smoke = Start-Process -PassThru -Wait -NoNewWindow -WorkingDirectory $bundle `
            -FilePath (Join-Path $bundle 'Foxity.exe') -ArgumentList '--smoke'
          if ($smoke.ExitCode -ne 0) {
            throw "Staged bundle smoke failed with exit code $($smoke.ExitCode)"
          }
      - name: Upload bundle
        if: matrix.preset == 'windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxity-windows-x86_64
          path: build/windows-msvc/bundles/Foxity/Release
          if-no-files-found: error
      - name: Verify the builds did not modify sources
        shell: pwsh
        run: |
          foreach ($tree in '.', '_engine') {
            git -C $tree diff --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $changes = git -C $tree status --porcelain
            if ($changes) { throw "Build modified sources in ${tree}:`n$changes" }
          }

  linux:
    name: Linux x86_64 headless (${{ matrix.preset }}${{ matrix.sanitize && ', sanitizers' || '' }})
    needs: engine-revision
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: linux-gcc, sanitize: false}
          - {preset: linux-clang, sanitize: false}
          # Address, undefined-behaviour and leak checks over every test.
          - {preset: linux-gcc, sanitize: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Use the pinned Clang
        if: matrix.preset == 'linux-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION"
          sudo update-alternatives --install /usr/bin/clang clang "/usr/bin/clang-$LLVM_VERSION" 200
          clang --version
      - name: Build headless engine SDK
        run: |
          cmake --preset "${{ matrix.preset }}" -S _engine -DLAIUE_BUILD_GRAPHICS=OFF
          cmake --build "_engine/build/${{ matrix.preset }}" --config Release \
            --target laiue_engine_bundle --parallel
      - name: Configure game
        run: |
          engine="$GITHUB_WORKSPACE/_engine/build/${{ matrix.preset }}/bundles/engine/Release/lib/cmake/laiue"
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            cmake --preset "${{ matrix.preset }}" "-Dlaiue_DIR=$engine" -DFOX_ENABLE_LTO=OFF \
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          else
            cmake --preset "${{ matrix.preset }}" "-Dlaiue_DIR=$engine"
          fi
      - name: Build and test Debug
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake --build --preset "${{ matrix.preset }}-debug" --parallel
          ctest --preset "${{ matrix.preset }}-debug" --no-tests=error --output-on-failure
      - name: Build and test Release
        if: ${{ !matrix.sanitize }}
        run: |
          cmake --build --preset "${{ matrix.preset }}-release" --parallel
          ctest --preset "${{ matrix.preset }}-release" --no-tests=error --output-on-failure
      - name: Verify the builds did not modify sources
        run: |
          for tree in . _engine; do
            git -C "$tree" diff --check
            test -z "$(git -C "$tree" status --porcelain)"
          done

  macos:
    name: macOS arm64 headless
    needs: engine-revision
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Install build dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
      - name: Build headless engine SDK
        run: |
          cmake --preset macos-clang-arm64 -S _engine -DLAIUE_BUILD_GRAPHICS=OFF
          cmake --build _engine/build/macos-clang-arm64 --config Release \
            --target laiue_engine_bundle --parallel
      - name: Configure game
        run: |
          engine="$GITHUB_WORKSPACE/_engine/build/macos-clang-arm64/bundles/engine/Release/lib/cmake/laiue"
          cmake --preset macos-clang-arm64 "-Dlaiue_DIR=$engine"
      - name: Build and test Debug
        run: |
          cmake --build --preset macos-clang-arm64-debug --parallel
          ctest --preset macos-clang-arm64-debug --no-tests=error --output-on-failure
      - name: Build and test Release
        run: |
          cmake --build --preset macos-clang-arm64-release --parallel
          ctest --preset macos-clang-arm64-release --no-tests=error --output-on-failure
      - name: Verify the builds did not modify sources
        run: |
          for tree in . _engine; do
            git -C "$tree" diff --check
            test -z "$(git -C "$tree" status --porcelain)"
          done

  android:
    name: Android APKs, x86_64 played in the emulator
    needs: engine-revision
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      FOX_ANDROID_PLATFORM: android-37.0
      FOX_BUILD_TOOLS: 37.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landiunload/laiue
          ref: ${{ needs.engine-revision.outputs.ref }}
          path: _engine
      - name: Install emulator runtime dependencies
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libx11-dev libx11-xcb-dev
      - name: Prepare pinned Android tools, the test image and a signing key
        timeout-minutes: 12
        run: |
          mkdir -p build/android-results "$RUNNER_TEMP/fox-sdk-tools" \
            "$RUNNER_TEMP/fox-emulator" "$RUNNER_TEMP/fox-avd" "$HOME/.android"
          touch "$HOME/.android/emu-update-last-check.ini"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/fox-avd" >> "$GITHUB_ENV"
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            --output "$RUNNER_TEMP/fox-sdk-tools.zip"
          printf '0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  %s\n' \
            "$RUNNER_TEMP/fox-sdk-tools.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/fox-sdk-tools.zip" -d "$RUNNER_TEMP/fox-sdk-tools"
          tools="$RUNNER_TEMP/fox-sdk-tools/cmdline-tools/bin"
          grep -Fx 'Pkg.Revision=23.0' "$tools/../source.properties"
          for ((answer=0; answer<32; ++answer)); do printf 'y\n'; done \
            > "$RUNNER_TEMP/fox-sdk-answers.txt"
          # dl.google.com occasionally cuts a download short (Premature EOF).
          for package in "platforms/$FOX_ANDROID_PLATFORM" "build-tools/$FOX_BUILD_TOOLS" \
            "system-images/$FOX_ANDROID_PLATFORM/google_apis/x86_64" "ndk/$ANDROID_NDK_VERSION"; do
            for attempt in 1 2 3; do
              if "$tools/android" --no-metrics --sdk="$ANDROID_HOME" sdk install "$package" \
                < "$RUNNER_TEMP/fox-sdk-answers.txt"; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              echo "::warning::Attempt $attempt to install $package failed"
              sleep 20
            done
          done
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            https://dl.google.com/android/repository/emulator-linux_x64-16428233.zip \
            --output "$RUNNER_TEMP/fox-emulator.zip"
          printf 'b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1  %s\n' \
            "$RUNNER_TEMP/fox-emulator.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/fox-emulator.zip" -d "$RUNNER_TEMP/fox-emulator"
          grep -Fx 'Pkg.Revision=37.2.12' "$RUNNER_TEMP/fox-emulator/emulator/source.properties"
          # A throwaway key: CI APKs are for testing, releases are signed elsewhere.
          keytool -genkeypair -keystore "$RUNNER_TEMP/fox-ci-debug.p12" \
            -storetype PKCS12 -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build and sign the APKs with the engine from source
        timeout-minutes: 20
        run: |
          tools="$ANDROID_HOME/build-tools/$FOX_BUILD_TOOLS"
          options=(
            "-DFOX_ENGINE_SOURCE_DIR=$GITHUB_WORKSPACE/_engine" -DFOX_ENGINE_FETCH=OFF
            "-DLAIUE_ANDROID_AAPT2=$tools/aapt2"
            "-DLAIUE_ANDROID_ZIPALIGN=$tools/zipalign"
            "-DLAIUE_ANDROID_APKSIGNER=$tools/apksigner"
            "-DLAIUE_ANDROID_FRAMEWORK_JAR=$ANDROID_HOME/platforms/$FOX_ANDROID_PLATFORM/android.jar"
            "-DLAIUE_ANDROID_KEYSTORE=$RUNNER_TEMP/fox-ci-debug.p12"
          )
          for preset in android-arm64 android-x86_64; do
            cmake --preset "$preset" "${options[@]}"
            cmake --build --preset "$preset-release" --target foxity_apk --parallel
            mkdir -p "build/android-apks/$preset"
            cp "build/$preset/android/foxity_apk.apk" "build/android-apks/$preset/Foxity.apk"
          done
      - name: Boot the emulator with software Vulkan
        timeout-minutes: 4
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          emulator="$RUNNER_TEMP/fox-emulator/emulator/emulator"
          timeout 15s "$emulator" -accel-check
          # The AVD is written by hand to keep the pinned system image.
          avd="$ANDROID_AVD_HOME/fox-ci.avd"
          mkdir -p "$avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=%s\n' \
            "$avd" "$FOX_ANDROID_PLATFORM" > "$ANDROID_AVD_HOME/fox-ci.ini"
          cat > "$avd/config.ini" <<CONFIG
          AvdId=fox-ci
          avd.ini.displayname=fox-ci
          avd.ini.encoding=UTF-8
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=2G
          hw.keyboard=yes
          hw.mainKeys=no
          hw.lcd.width=1080
          hw.lcd.height=1920
          hw.lcd.density=420
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader
          hw.camera.back=none
          hw.camera.front=none
          fastboot.forceColdBoot=yes
          image.sysdir.1=$ANDROID_HOME/system-images/$FOX_ANDROID_PLATFORM/google_apis/x86_64/
          tag.id=google_apis
          tag.display=Google APIs
          CONFIG
          setsid timeout --signal=TERM --kill-after=10s 900s "$emulator" \
            -avd fox-ci -no-metrics -no-snapshot -no-boot-anim -no-audio -no-window \
            -gpu swiftshader -accel on -port 5554 -cores 2 -memory 2048 \
            > build/android-results/emulator.log 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/fox-emulator.pid"
          adb="$ANDROID_HOME/platform-tools/adb"
          boot_deadline=$((SECONDS + 180))
          timeout 90s "$adb" -s emulator-5554 wait-for-device
          until [ "$(timeout 5s "$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do
            if [ "$SECONDS" -ge "$boot_deadline" ]; then
              cat build/android-results/emulator.log
              exit 1
            fi
            sleep 2
          done
          timeout 10s "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          timeout 10s "$adb" -s emulator-5554 shell wm dismiss-keyguard
      - name: Play the x86_64 APK until three frames are on screen
        timeout-minutes: 5
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          log=build/android-results/foxity.log
          timeout 60s "$adb" -s emulator-5554 install -r build/android-apks/android-x86_64/Foxity.apk
          timeout 10s "$adb" -s emulator-5554 logcat -c
          timeout 30s "$adb" -s emulator-5554 shell am start -W \
            -n dev.landiunload.foxity/android.app.NativeActivity --es args --smoke
          # The game logs as Foxity; the engine's window module logs under
          # the package name and reports a failed main there.
          deadline=$((SECONDS + 180))
          until timeout 10s "$adb" -s emulator-5554 logcat -d -s Foxity:V dev.landiunload.foxity:V > "$log" \
              && grep -Fq 'smoke: 3 of 3 frames presented' "$log"; do
            if [ "$SECONDS" -ge "$deadline" ] || grep -Fq 'main returned' "$log"; then
              cat "$log"
              timeout 10s "$adb" -s emulator-5554 logcat -d -b crash || true
              exit 1
            fi
            sleep 2
          done
          cat "$log"
      - name: Stop the owned emulator process group
        if: always()
        timeout-minutes: 1
        run: |
          pid_file="$RUNNER_TEMP/fox-emulator.pid"
          if [ -f "$pid_file" ]; then
            emulator_pid="$(cat "$pid_file")"
            if [[ ! "$emulator_pid" =~ ^[0-9]+$ ]]; then exit 1; fi
            if kill -0 -- "-$emulator_pid" 2>/dev/null; then
              timeout 10s "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
              stop_deadline=$((SECONDS + 20))
              while kill -0 -- "-$emulator_pid" 2>/dev/null; do
                if [ "$SECONDS" -ge "$stop_deadline" ]; then
                  kill -KILL -- "-$emulator_pid" 2>/dev/null || true
                  break
                fi
                sleep 1
              done
            fi
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxity-android
          path: build/android-apks
          if-no-files-found: error
      - name: Upload emulator diagnostics
        if: always() && hashFiles('build/android-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxity-android-diagnostics
          path: build/android-results
          if-no-files-found: error
      - name: Verify the builds did not modify sources
        run: |
          for tree in . _engine; do
            git -C "$tree" diff --check
            test -z "$(git -C "$tree" status --porcelain)"
          done

  ci:
    name: All checks
    if: always()
    needs: [engine-revision, windows, linux, macos, android]
    runs-on: ubuntu-slim
    steps:
      - name: Require every job to pass
        if: >
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
